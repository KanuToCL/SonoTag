# Visualize Skill Evaluation Criteria
# Generated: 2026-02-08, Refined: 2026-02-10
# Purpose: Validate that the visualize skill adheres to established best practices
#   from archetype references while maintaining creative diversity (per D92634200).
# Coverage: Key archetypes with archetype-specific quality checks + edge/negative/pressure
#   + real-world MCP integration tests using actual Meta artifacts (diffs, SEVs, posts).
# Total: 20 test cases (18 original + 2 new real-world MCP tests; 2 existing updated with real data)

# ============================================================
# HAPPY PATH — Archetype-specific best practice validation
# ============================================================

- id: TC-001
  name: "Session Summary — timeline, decisions, action items"
  category: happy_path
  prompt: "/visualize summarize this work session: Investigated a P0 bug where OAuth tokens were expiring prematurely. Root cause was a timezone mismatch in the token expiry calculation — server used UTC but client compared against local time. Fixed by normalizing both to UTC in the token validator. Wrote 4 unit tests covering edge cases (DST transition, leap second, negative offset, max expiry). All tests passing. Deployed fix to canary, monitoring shows 0 auth failures in past hour. Decision: will add a global timezone lint rule to prevent recurrence. Action item: @alexahn create lint rule by EOW. Action item: @sre-oncall monitor canary for 24h."
  description: "Tests Session Summary archetype — must use timeline structure, highlight decisions visually, collect action items with owners"
  expected_behavior: "Creates HTML with chronological timeline, visually distinct decision callouts, and action items checklist with owners"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "OAuth", "UTC", "timeline", "decision", "action"]
    required_absent: ["I cannot", "undefined", "traceback"]
    semantic_checks:
      - question: "Does the HTML use a vertical timeline or chronological structure with timestamps to organize the session events?"
        weight: 3
      - question: "Are decisions rendered as visually distinct callout blocks (bordered, colored, or highlighted) that break the timeline rhythm and demand attention — NOT buried in paragraph text?"
        weight: 3
      - question: "Is there an action items section at the bottom with checkboxes, owner names (@alexahn, @sre-oncall), and deadlines?"
        weight: 3
      - question: "Does the page have a compact header with session metadata (title, date) followed immediately by 2-3 key outcome bullets?"
        weight: 2
      - question: "Does the HTML include dark mode toggle and print button?"
        weight: 1
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "OAuth", "UTC", "alexahn"]
  timeout_seconds: 600
  max_budget_usd: 5.0

- id: TC-002
  name: "Dashboard — KPI cards, status colors, trend indicators"
  category: happy_path
  prompt: "/visualize a dashboard showing these service health metrics: API Gateway latency P50 12ms P99 89ms (target <100ms), Error rate 0.03% (target <0.1%), Request volume 45K QPS (+8% WoW), Cache hit rate 94.2% (-1.3% WoW), DB connection pool 67/100 used, Deployment status: canary healthy v2.4.1, 3 active alerts (2 warning, 1 info)"
  description: "Tests Dashboard archetype — must have KPI metric cards with trends, status colors used semantically, last-updated timestamp"
  expected_behavior: "Creates HTML dashboard with header+status badge, 4-6 KPI cards with trend arrows, status colors (green/yellow/red), and alerts section"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "dashboard", "12ms", "89ms", "0.03%"]
    required_absent: ["error", "undefined", "traceback"]
    semantic_checks:
      - question: "Does the dashboard have a header bar with title, a 'last updated' timestamp, and an overall status badge giving instant health read?"
        weight: 3
      - question: "Are there 4-6 KPI metric cards in a row at the top, each showing the metric value with a trend indicator (up/down arrow, sparkline, or delta value)?"
        weight: 3
      - question: "Are status colors (green, yellow, red) used consistently and semantically — green for healthy metrics meeting target, yellow/red for those approaching or exceeding thresholds — NOT decoratively?"
        weight: 3
      - question: "Is there at least one chart showing a trend over time (line chart, sparkline, or bar chart) with clear axis labels?"
        weight: 2
      - question: "Is the visual hierarchy correct: KPIs at top, then trends/charts, then details, then alerts at bottom?"
        weight: 2
      - question: "Are there NO more than 6-8 top-level KPIs displayed? (Too many dilutes attention)"
        weight: 1
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "12ms", "0.03%"]
  timeout_seconds: 600
  max_budget_usd: 5.0

- id: TC-003
  name: "Presentation Deck — fullscreen slides, keyboard nav, no scrolling"
  category: happy_path
  prompt: "/visualize a presentation on why we should adopt TypeScript for our frontend codebase. Slide 1: Title - TypeScript Migration Proposal. Slide 2: The Problem - 47% of production bugs are type-related. Slide 3: The Solution - TypeScript catches 38% of bugs at compile time (study by Airbnb). Slide 4: Migration plan - 3 phases over 6 months. Slide 5: Cost - 2 eng-weeks per phase. Slide 6: Call to action - approve Phase 1 starting next sprint."
  description: "Tests Presentation Deck archetype — STRICT layout requirements: fullscreen slides, no scrolling, keyboard nav, no text walls"
  expected_behavior: "Creates HTML with fullscreen slides (100vw x 100vh), arrow navigation, keyboard support, slide counter, progress bar, no scrolling"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "100vh", "slide", "TypeScript"]
    required_absent: ["error", "undefined", "traceback"]
    semantic_checks:
      - question: "Does each slide occupy exactly the full viewport (100vh) with NO scrolling (overflow: hidden)? This is a strict requirement — any scrollable content is a failure."
        weight: 3
      - question: "Is there keyboard navigation using ArrowLeft/ArrowRight keys AND visible on-screen arrow buttons?"
        weight: 3
      - question: "Does the deck include a slide counter showing current position (e.g., '3 / 6') and a progress bar?"
        weight: 2
      - question: "Does the last slide end with a call to action ('approve Phase 1') — NOT a generic 'Questions?' slide?"
        weight: 2
      - question: "Is text kept minimal on each slide (no walls of text, no paragraphs)? Each slide should have ONE dominant visual element."
        weight: 2
      - question: "Are all 6 slides present with content matching the specified topics?"
        weight: 2
      - question: "Is there a print/download button that renders slides as separate pages?"
        weight: 1
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "100vh", "TypeScript", "goSlide"]
  timeout_seconds: 600
  max_budget_usd: 5.0

- id: TC-004
  name: "Experiment Report — verdict-first, SS badges, colored containers"
  category: happy_path
  prompt: "/visualize an experiment report: A/B test 'redesigned_checkout_v2', ran 2 weeks on iOS. Control: 100K users, conversion rate 3.2%, revenue/user $12.50, bounce rate 45%. Treatment: 100K users, conversion rate 4.1% (+28% lift, p=0.003 SS), revenue/user $14.20 (+13.6%, p=0.01 SS), bounce rate 38% (-15.6%, p=0.008 SS). Root cause of lift: simplified 3-step checkout replaced 5-step flow. Recommendation: ship treatment to 100%."
  description: "Tests Experiment Report archetype — STRICT requirements: verdict first, dark text on colored containers, SS badges, confidence intervals, saturation scaling"
  expected_behavior: "Creates HTML with verdict banner at top, metrics with SS/NSS badges, dark text with colored container backgrounds (NOT colored text), and hypothesis section"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "experiment", "3.2%", "4.1%", "0.003"]
    required_absent: ["error", "I cannot", "traceback"]
    semantic_checks:
      - question: "Does the page lead with a verdict/conclusion banner (SHIP/NO SHIP/MIXED) in the FIRST visible section, with severity-appropriate coloring? The verdict must be visible within 3 seconds of page load — NOT buried at the bottom."
        weight: 3
      - question: "Are metric values displayed in DARK text (near-black) with color on the CONTAINER (background tints, borders, badges) — NOT colored text for numbers? This is a strict anti-pattern: colored numbers are hard to read."
        weight: 3
      - question: "Does color saturation scale with magnitude? A +28% lift should have a MORE saturated green background than a +13.6% lift."
        weight: 2
      - question: "Are there SS (statistically significant) and/or NSS badges next to every reported metric? Every number needs a significance indicator."
        weight: 3
      - question: "Is the hypothesis clearly stated as 'We expected X because Y' or similar causal framing?"
        weight: 2
      - question: "Are p-values shown alongside the delta values for every metric?"
        weight: 2
      - question: "Is there at least one chart (bar chart for comparison, or line chart for trend)?"
        weight: 2
      - question: "Is there a specific recommendation section with actionable next steps (ship to 100%, iterate, kill)?"
        weight: 2
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "3.2%", "4.1%", "0.003"]
  timeout_seconds: 600
  max_budget_usd: 5.0

- id: TC-005
  name: "Comparison Matrix — scoring table, winner badge, balanced"
  category: happy_path
  prompt: "/visualize compare three state management solutions for our React app: Redux (mature, verbose, large ecosystem, 18KB, steep learning curve), Zustand (simple, small, TS-first, 1KB, minimal boilerplate), and Jotai (atomic, composable, 3KB, React-native friendly, newer community). Criteria: bundle size, learning curve, TypeScript support, devtools, community size, performance. Recommend one."
  description: "Tests Comparison Matrix archetype — structured comparison with visual scoring and clear recommendation"
  expected_behavior: "Creates HTML with comparison table or cards, visual scoring, winner highlight, and balanced presentation of trade-offs"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "Redux", "Zustand", "Jotai"]
    required_absent: ["error", "I cannot"]
    semantic_checks:
      - question: "Does the HTML include a structured comparison showing all three options against ALL six specified criteria (bundle size, learning curve, TypeScript support, devtools, community size, performance)?"
        weight: 3
      - question: "Are the ratings/scores visual (dots, stars, colored progress bars, or numeric scales) rather than just prose descriptions?"
        weight: 2
      - question: "Is there a clear winner/recommendation with a visual indicator (badge, highlight border, or prominent callout)?"
        weight: 2
      - question: "Is the presentation balanced, showing BOTH strengths AND weaknesses for each option — not just promoting the winner?"
        weight: 2
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "Redux", "Zustand", "Jotai"]
  timeout_seconds: 600
  max_budget_usd: 5.0

- id: TC-006
  name: "Visual/Diagram — colored boxes, connectors, legend"
  category: happy_path
  prompt: "/visualize a system architecture diagram for our ad serving pipeline: User Request enters Load Balancer, routes to Ad Server (Go), which queries Ad Ranking Service (Python/ML) and Creative Store (Redis). Ad Ranking calls Feature Store (Scuba) and ML Model Server (PyTorch). Response flows back through Ad Server which assembles the creative and returns to user. Monitoring via Scuba and ODS at every hop."
  description: "Tests Visual/Diagram archetype — colored boxes, connectors, legend, fits on one screen"
  expected_behavior: "Creates HTML with structural diagram using colored boxes for components, arrows for data flow, and a legend"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "Ad Server", "Load Balancer"]
    required_absent: ["error", "I cannot"]
    semantic_checks:
      - question: "Does the HTML render a structural diagram with colored boxes or containers for each system component (Load Balancer, Ad Server, Ad Ranking, etc.)?"
        weight: 3
      - question: "Are there visual connectors (arrows, lines, or SVG paths) showing the data flow direction from User Request through the pipeline?"
        weight: 3
      - question: "Is there a legend explaining what each color or category represents?"
        weight: 2
      - question: "Does the diagram fit on one screen without requiring horizontal or vertical scrolling?"
        weight: 1
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "Ad Server", "Load Balancer"]
  timeout_seconds: 600
  max_budget_usd: 5.0

- id: TC-007
  name: "SEV Review (real) — S608506 DSS-4 Claude CLI incident"
  category: happy_path
  prompt: "/visualize SEV S608506"
  description: "Tests SEV Review archetype with a REAL SEV fetched via MCP tool. S608506 is a SEV 3 about employees using non-DSS4-approved Claude CLI to write PSCs. Tests: MCP content fetching, severity-appropriate theming (SEV 3 = blue/teal, not red), timeline extraction from real data, DERP section synthesis, follow-up task rendering."
  expected_behavior: "Fetches SEV data via knowledge_load MCP tool, creates HTML with blue/teal header (SEV 3), visual timeline with level changes and mitigation, DERP sections synthesized from real remediation/detection/prevention fields, follow-up task T253697828"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "608506", "SEV", "DSS"]
    required_absent: ["error", "I cannot", "traceback"]
    semantic_checks:
      - question: "Did the skill fetch SEV data via an MCP tool (knowledge_load or similar) rather than asking the user to paste the content?"
        weight: 3
      - question: "Does the header use severity-appropriate coloring for SEV 3 (blue, teal, or similar — NOT red which would be SEV 1, NOT amber which would be SEV 2)?"
        weight: 2
      - question: "Is there a visual timeline showing the incident progression including the severity level changes (3→4→3) and mitigation event?"
        weight: 3
      - question: "Are DERP sections (Detection, Escalation, Remediation, Prevention) present with content synthesized from the real SEV fields — detection via workplace post reports, remediation via Performance FYI post and ACLs, prevention via governance improvements?"
        weight: 2
      - question: "Does it include the follow-up task T253697828 ('Get Claude CLI approved for DSS-4') with owner and priority?"
        weight: 2
      - question: "Is the root cause clearly stated — employees didn't know Claude CLI is DSS-3 approved only, while PSC self-reviews are DSS-4 data?"
        weight: 2
      - question: "Does it mention the real impact — multiple viral workplace posts driving employees to use Claude for PSCs?"
        weight: 1
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "608506", "DSS"]
  timeout_seconds: 900
  max_budget_usd: 7.0

