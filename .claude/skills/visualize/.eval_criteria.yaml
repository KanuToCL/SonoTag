  name: "Creativity test — second dashboard with different data"
  category: happy_path
  prompt: "/visualize a dashboard for our ML training pipeline: GPU Utilization 78% (target >90%), Training Loss 0.023 (converging), Epochs Completed 45/100, Checkpoint Size 2.3GB, Data Throughput 1.2M samples/hr, ETA to completion: 14 hours, Active Experiments: 3 (2 healthy, 1 degraded)"
  description: "Tests that a second dashboard invocation produces a DIFFERENT visual design than TC-002, while still following dashboard best practices"
  expected_behavior: "Creates HTML dashboard that follows dashboard best practices but looks visually distinct from a generic dashboard"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "GPU", "78%", "0.023"]
    required_absent: ["error", "I cannot"]
    semantic_checks:
      - question: "Does the dashboard follow core best practices: header with last-updated, KPI metric cards, trend indicators, semantic status colors?"
        weight: 3
      - question: "Does the design show creative variety in its visual treatment — using a distinctive color palette, typography, or layout approach that goes beyond a generic corporate dashboard?"
        weight: 3
      - question: "Does it avoid looking like a cookie-cutter template (same colors, same card shapes, same fonts as every other dashboard)?"
        weight: 2
