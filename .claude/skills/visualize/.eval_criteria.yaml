  max_budget_usd: 5.0

- id: TC-009
  name: "Diff Review (real) — D92125092 visualize skill creation diff"
  category: happy_path
  prompt: "/visualize diff D92125092"
  description: "Tests Diff Review archetype with a REAL Phabricator diff fetched via MCP tool. D92125092 is the original /visualize skill creation diff — a large single-file addition (~873 lines of SKILL.md). Tests: MCP diff fetching, card-based change summary for a large new-file diff, file cards with real paths, review checklist, handling of reviewer inline comments as risk items."
  expected_behavior: "Fetches diff data via get_phabricator_diff_details MCP tool, creates HTML with diff header linking to D92125092, stats bar (1 file, ~873 lines added), What Changed cards describing the skill creation, file card for SKILL.md, review checklist, and risk/feedback section noting the two inline reviewer comments (NaN sort handling, clipboard API error handling)"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "D92125092", "visualize"]
    required_absent: ["error", "I cannot", "traceback"]
    semantic_checks:
      - question: "Did the skill fetch diff data via an MCP tool (get_phabricator_diff_details or similar) rather than asking the user to paste the content?"
        weight: 3
      - question: "Does the header display D92125092 linked to Phabricator (https://www.internalfb.com/diff/D92125092)?"
        weight: 2
      - question: "Does it include card-based 'What Changed' sections explaining what the diff does — adding a /visualize skill for HTML visualization and Pixelcloud sharing?"
        weight: 2
      - question: "Does it show a file card for the real file path (fbcode/claude-templates/components/skills/visualize/SKILL.md) with accurate line count stats?"
        weight: 2
      - question: "Is there a review checklist with interactive checkboxes?"
        weight: 2
      - question: "Does it surface the two real reviewer inline comments (NaN sort handling bug, clipboard API promise rejection) as risk items or feedback to address?"
        weight: 2
      - question: "Does it show the diff status as 'Closed' (landed)?"
        weight: 1
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "D92125092", "SKILL.md"]
  timeout_seconds: 900
  max_budget_usd: 7.0

- id: TC-010
  name: "Knowledge Graph — D3 force-directed, draggable, colored categories"
  category: happy_path
  prompt: "/visualize a knowledge graph of our frontend architecture: Nodes - React (framework), Relay (data fetching), GraphQL (API layer), Flow (type checking), StyleX (styling), Jest (testing), Webpack (bundling), Storybook (component dev). Connections: React uses Relay, Relay queries GraphQL, Flow checks React and Relay, StyleX styles React, Jest tests React and Relay, Webpack bundles React and StyleX, Storybook renders React. Categories: Core (React, Relay, GraphQL), Tooling (Flow, Jest, Webpack), UI (StyleX, Storybook)."
  description: "Tests Graph archetype — interactive D3 graph with colored nodes, drag, hover, zoom, legend"
  expected_behavior: "Creates HTML with D3 force-directed graph, nodes colored by category, interactive drag/hover/zoom"
  eval_target: artifact
  quality_criteria:
    required_present: ["html", "d3", "React", "Relay"]
    required_absent: ["error", "I cannot"]
    semantic_checks:
      - question: "Does the HTML render an interactive force-directed graph using D3.js (not a static image or Mermaid)?"
        weight: 3
      - question: "Are nodes colored by category (Core, Tooling, UI) with a visible legend?"
        weight: 2
      - question: "Is there interactivity: node dragging, hover tooltips, and zoom/pan?"
        weight: 2
      - question: "Are the connections correct and matching the described relationships?"
        weight: 1
    artifact_checks:
      - path: "~/visualize/**/*.html"
        content_contains: ["<html", "d3", "React"]
  timeout_seconds: 600
  max_budget_usd: 5.0

