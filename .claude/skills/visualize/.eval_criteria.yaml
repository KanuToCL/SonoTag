# ============================================================
# EDGE CASES
# ============================================================

- id: TC-012
  name: "No arguments provided"
  category: edge_case
  prompt: "/visualize"
  description: "Tests behavior when skill is invoked with no argument — should ask what to visualize"
  expected_behavior: "Should ask what to visualize rather than crashing or producing empty HTML"
  eval_target: response
  quality_criteria:
    required_present: ["what", "visualize"]
    required_absent: ["traceback", "undefined", "NoneType"]
    semantic_checks:
      - question: "Does the skill gracefully handle the missing argument by asking what to visualize?"
        weight: 3
      - question: "Does the response offer examples or suggestions of what can be visualized?"
        weight: 1
  timeout_seconds: 300
  max_budget_usd: 3.0

- id: TC-013
  name: "Extremely vague input"
  category: edge_case
  prompt: "/visualize the thing from earlier"
  description: "Tests behavior with ambiguous instruction lacking any context"
  expected_behavior: "Should ask clarifying questions rather than guessing"
  eval_target: response
  quality_criteria:
    required_present: ["what", "clarif"]
    required_absent: ["traceback", "error"]
    semantic_checks:
      - question: "Does the skill recognize the ambiguity and ask for clarification instead of guessing?"
        weight: 3
      - question: "Does it offer concrete suggestions of what could be visualized?"
        weight: 2
  timeout_seconds: 300
  max_budget_usd: 3.0

