- id: TC-005
  name: "Complex multi-function call chain tracing"
  category: real_world
  prompt: |
    I wrote this task scheduler. Please write it to /tmp/grill_eval/scheduler.py and then /grill me on it. Choose option 3 (specific file).

    ```python
    import threading
    import time
    from collections import deque
    from uuid import uuid4

    class TaskScheduler:
        MAX_QUEUE_SIZE = 50
        PRIORITY_LEVELS = 3

        def __init__(self):
            self._queues = [deque() for _ in range(self.PRIORITY_LEVELS)]
            self._lock = threading.Lock()
            self._running: dict[str, threading.Thread] = {}
            self._max_concurrent = 5
            self._completed: list[str] = []

        def submit(self, task_fn, priority: int = 1) -> str:
            if priority < 0 or priority >= self.PRIORITY_LEVELS:
                raise ValueError(f"Priority must be 0-{self.PRIORITY_LEVELS - 1}")
            with self._lock:
                total = sum(len(q) for q in self._queues)
                if total >= self.MAX_QUEUE_SIZE:
                    raise RuntimeError("Task queue is full")
                task_id = uuid4().hex[:8]
                self._queues[priority].append((task_id, task_fn))
                return task_id

        def _get_next(self):
            with self._lock:
                for queue in self._queues:
                    if queue:
                        return queue.popleft()
            return None

        def run_loop(self):
            while True:
                with self._lock:
                    active = len(self._running)
                if active >= self._max_concurrent:
                    time.sleep(0.1)
                    continue
                next_item = self._get_next()
                if next_item is None:
                    time.sleep(0.1)
                    continue
                task_id, task_fn = next_item
                t = threading.Thread(target=self._execute, args=(task_id, task_fn))
                self._running[task_id] = t
                t.start()

        def _execute(self, task_id: str, task_fn):
            try:
                task_fn()
            except Exception:
                pass  # Swallow exceptions silently
            finally:
                with self._lock:
                    del self._running[task_id]
                    self._completed.append(task_id)

        def get_status(self) -> dict:
            with self._lock:
                queued = sum(len(q) for q in self._queues)
                running = len(self._running)
                completed = len(self._completed)
            return {"queued": queued, "running": running, "completed": completed}
    ```

    This has threading, priority queues, and multiple interacting methods. Generate all questions first and focus on the most complex aspects. I want to be challenged hard.
  description: "Tests grill's ability to trace complex multi-function code with threading, locks, priority queues, and interleaved state management"
  expected_behavior: "Questions should demonstrate deep understanding of: (1) lock acquisition ordering, (2) priority queue semantics (0 is highest), (3) max concurrent = 5, (4) exception swallowing in _execute, (5) thread safety of _completed list access. Should identify the race condition in run_loop."
  eval_target: response
  quality_criteria:
    required_present: ["question", "thread", "lock", "priority"]
    required_absent: ["I cannot analyze", "too complex"]
    semantic_checks:
      - question: "Does the skill identify the race condition between checking active count and starting new threads in run_loop?"
        weight: 5
      - question: "Does the skill correctly understand the priority queue semantics (queue[0] is highest priority, checked first)?"
        weight: 3
      - question: "Does the skill ask about the exception swallowing pattern in _execute and its implications?"
        weight: 3
      - question: "Do questions accurately reference the constants (MAX_QUEUE_SIZE=50, PRIORITY_LEVELS=3, max_concurrent=5)?"
        weight: 4
      - question: "Does the skill identify thread-safety concerns around _running dict access?"
        weight: 3
