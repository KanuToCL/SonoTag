- id: TC-004
  name: "Pipeline data flow tracing"
  category: edge_case
  prompt: |
    I wrote this log analyzer. Please write it to /tmp/grill_eval/log_analyzer.py and then /grill me on it. Choose option 3 (specific file).

    ```python
    import random

    def analyze_logs(raw_logs: list[str]) -> dict[str, int]:
        # Step 1: Parse valid entries only (lines starting with "[")
        parsed = [parse_entry(log) for log in raw_logs if log.startswith("[")]

        # Step 2: Sample if too many (cap at 100)
        if len(parsed) > 100:
            parsed = random.sample(parsed, 100)

        # Step 3: Classify by level
        classified: dict[str, list] = {}
        for entry in parsed:
            level = entry["level"]
            if level not in classified:
                classified[level] = []
            classified[level].append(entry)

        # Step 4: Count per level
        return {level: len(entries) for level, entries in classified.items()}

    def parse_entry(log: str) -> dict:
        level = log[1:log.index("]")]
        message = log[log.index("]") + 2:]
        return {"level": level, "message": message}
    ```

