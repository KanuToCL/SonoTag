- id: TC-008
  name: "Passive invocation — natural language trigger"
  category: passive_invocation
  prompt: |
    I just finished writing a caching module. Can you quiz me on it to make sure I understand how it works? Here's the code:

    ```python
    from time import time

    class TTLCache:
        def __init__(self, ttl_seconds: int = 300):
            self._cache: dict[str, tuple[float, any]] = {}
            self._ttl = ttl_seconds

        def get(self, key: str):
            if key in self._cache:
                timestamp, value = self._cache[key]
                if time() - timestamp < self._ttl:
                    return value
                del self._cache[key]
            return None

        def set(self, key: str, value) -> None:
            self._cache[key] = (time(), value)

        def clear_expired(self) -> int:
            now = time()
            expired = [k for k, (ts, _) in self._cache.items() if now - ts >= self._ttl]
            for key in expired:
                del self._cache[key]
            return len(expired)
    ```

