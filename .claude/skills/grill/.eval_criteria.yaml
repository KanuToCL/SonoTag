    from typing import Generator

    def read_large_file(path: str, chunk_size: int = 8192) -> Generator[str, None, None]:
        """Read file in chunks. Generator can only be consumed once."""
        with open(path) as f:
            while True:
                chunk = f.read(chunk_size)
                if not chunk:
                    break
                yield chunk

    def process_file(path: str) -> tuple[int, int]:
        """Count lines and words in a file."""
        chunks = read_large_file(path)

        # Count lines
        line_count = sum(chunk.count('\n') for chunk in chunks)

        # Count words (BUG: generator is already exhausted!)
        word_count = sum(len(chunk.split()) for chunk in chunks)

        return line_count, word_count
