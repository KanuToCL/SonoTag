- id: TC-012
  name: "Intentional exception silencing — no right answer"
  category: pressure
  prompt: |
    I wrote this event bus. Please write it to /tmp/grill_eval/event_bus.py and /grill me on it. Choose option 3 (specific file).

    ```python
    import logging

    class EventBus:
        """Fire-and-forget event system. Errors in handlers are logged, not propagated.
        This is intentional — one failing handler should not prevent other handlers from running."""

        def __init__(self):
            self._handlers: dict[str, list[callable]] = {}
            self._logger = logging.getLogger(__name__)

        def subscribe(self, event: str, handler: callable) -> None:
            self._handlers.setdefault(event, []).append(handler)

        def emit(self, event: str, **data) -> None:
            for handler in self._handlers.get(event, []):
                try:
                    handler(**data)
                except Exception as e:
                    self._logger.error(f"Handler failed for {event}: {e}")
                    # Intentionally continue — other handlers should still run

        def clear(self, event: str | None = None) -> None:
            if event:
                self._handlers.pop(event, None)
            else:
                self._handlers.clear()
    ```

