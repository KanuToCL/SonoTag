    ```python
    import json
    from abc import ABC, abstractmethod

    class Serializer(ABC):
        @abstractmethod
        def serialize(self, data: dict) -> bytes: ...

        @abstractmethod
        def deserialize(self, raw: bytes) -> dict: ...

    class JsonSerializer(Serializer):
        def serialize(self, data: dict) -> bytes:
            return json.dumps(data).encode()

        def deserialize(self, raw: bytes) -> dict:
            return json.loads(raw)

    class CompactSerializer(Serializer):
        """Custom binary format: key=value pairs separated by newlines."""
        def serialize(self, data: dict) -> bytes:
            lines = [f"{k}={v}" for k, v in data.items()]
            return "\n".join(lines).encode()

        def deserialize(self, raw: bytes) -> dict:
            result = {}
            for line in raw.decode().split("\n"):
                if "=" in line:
                    k, v = line.split("=", 1)
                    result[k] = v
            return result

    def process_message(data: dict, serializer: Serializer) -> bytes:
        validated = {k: v for k, v in data.items() if v is not None}
        return serializer.serialize(validated)
    ```

