        """Create validation functions from (field_name, max_length) rules.
        CORRECT version — uses default args to capture loop variables."""
        validators = []
        for field, max_len in rules:
            def validate(value, _field=field, _max=max_len):
                if not isinstance(value, str):
                    return f"{_field}: expected string"
                if len(value) > _max:
