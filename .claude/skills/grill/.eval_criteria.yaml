    from typing import Iterator

    class Paginator:
        """Paginate a sequence with configurable page size."""

        def __init__(self, items: list, page_size: int = 20):
            if page_size < 1:
                raise ValueError("page_size must be positive")
            self._items = list(items)  # Defensive copy
            self._page_size = page_size

        @property
        def total_pages(self) -> int:
            if not self._items:
                return 0
            return (len(self._items) + self._page_size - 1) // self._page_size

        def get_page(self, page: int) -> list:
            """Get items for a 1-indexed page number."""
            if page < 1 or page > self.total_pages:
                return []
            start = (page - 1) * self._page_size
            return self._items[start:start + self._page_size]

        def __iter__(self) -> Iterator[list]:
            """Iterate through all pages."""
            for i in range(1, self.total_pages + 1):
                yield self.get_page(i)

        def __len__(self) -> int:
            return self.total_pages
    ```

