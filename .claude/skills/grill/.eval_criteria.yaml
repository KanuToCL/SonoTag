    I wrote this small utility. Please write it to /tmp/grill_eval/rate_limiter.py and /grill me on it. Choose option 3 (specific file).

    ```python
    import time

    class RateLimiter:
        def __init__(self, max_calls: int, window_sec: float):
            self._max_calls = max_calls
            self._window = window_sec
            self._calls: list[float] = []

        def allow(self) -> bool:
            now = time.monotonic()
            self._calls = [t for t in self._calls if now - t < self._window]
            if len(self._calls) >= self._max_calls:
                return False
            self._calls.append(now)
            return True

        def wait_and_allow(self) -> None:
            while not self.allow():
                time.sleep(0.01)
    ```

