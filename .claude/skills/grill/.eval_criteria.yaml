    import random
    import subprocess
    from concurrent.futures import ThreadPoolExecutor, TimeoutError as FuturesTimeoutError
    from typing import Dict, Set, Tuple, Optional, List

    # Constants
    MAX_SOMEPATH_SAMPLES = 10
    SOMEPATH_TIMEOUT_SECONDS = 60
    SOMEPATH_MAX_WORKERS = 10

    def compute_new_targets(
        current_targets: Dict[str, Set[str]],
        previous_targets: Optional[Dict[str, Set[str]]]
    ) -> Dict[str, Set[str]]:
        """Compute new targets that appeared since last run."""
        if previous_targets is None:
            # First run: all targets are considered new
            total_new = sum(len(targets) for targets in current_targets.values())
            print(f"\nFirst run detected: All {total_new:,} targets are new")
            return current_targets

        new_targets: Dict[str, Set[str]] = {}
        for entry_point, targets in current_targets.items():
            prev = previous_targets.get(entry_point, set())
            new = targets - prev
            if new:
                new_targets[entry_point] = new
        return new_targets

    def run_somepath_query(target: str, entry_point: str) -> Optional[str]:
        """Run buck2 cquery somepath to trace dependency path."""
        cmd = ["buck2", "cquery", f"somepath({target}, {entry_point})"]
        try:
            result = subprocess.run(
                cmd,
                capture_output=True,
                text=True,
                timeout=SOMEPATH_TIMEOUT_SECONDS,
            )
            if result.returncode != 0:
                return None

            path_parts = []
            for line in result.stdout.strip().split("\n"):
                line = line.strip()
                if not line:
                    continue
                # Strip configuration suffix from buck2 output
                if " (cfg:" in line:
                    line = line.split(" (cfg:")[0]
                path_parts.append(line)
            return ",".join(path_parts) if path_parts else None
        except subprocess.TimeoutExpired:
            print(f"  Timeout: {target} -> {entry_point}")
            return None

    def sample_and_run_somepath(
        new_targets: Dict[str, Set[str]]
    ) -> Dict[Tuple[str, str], str]:
        """Sample new targets and run somepath queries in parallel."""
        sampled: List[Tuple[str, str]] = []

        for entry_point, targets in new_targets.items():
            targets_list = list(targets)
            if len(targets_list) > MAX_SOMEPATH_SAMPLES:
                sampled_targets = random.sample(targets_list, MAX_SOMEPATH_SAMPLES)
            else:
                sampled_targets = targets_list
            for target in sampled_targets:
                sampled.append((target, entry_point))

        print(f"\nRunning somepath for {len(sampled)} sampled targets...")

        results: Dict[Tuple[str, str], str] = {}
        with ThreadPoolExecutor(max_workers=SOMEPATH_MAX_WORKERS) as executor:
            future_to_target = {
                executor.submit(run_somepath_query, target, ep): (target, ep)
                for target, ep in sampled
            }
            for future in future_to_target:
                target, ep = future_to_target[future]
                try:
                    path = future.result(timeout=SOMEPATH_TIMEOUT_SECONDS + 5)
                    if path:
                        results[(target, ep)] = path
                except (FuturesTimeoutError, Exception) as e:
                    print(f"  Error: {target} -> {ep}: {e}")

        return results
    ```

