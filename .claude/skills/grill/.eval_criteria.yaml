    ```python
    def deduplicate_and_sort(items: list[str]) -> list[str]:
        """Remove duplicates and return sorted list."""
        seen = set()
        unique = []
        for item in items:
            normalized = item.strip().lower()
            if normalized not in seen:
                seen.add(normalized)
                unique.append(item)
        return sorted(unique, key=str.lower)
    ```

